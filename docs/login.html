<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Trollify PC login</title>
<body style="background:#000;color:#fff;font-family:monospace;text-align:center;padding-top:15vh">
<h2>TROLLIFY</h2>
<p>Log in to Spotify here on your PC, then scan the QR code with the iPad.</p>
<button id="go" style="font:bold 18px monospace;padding:14px 28px;border-radius:30px;border:0;cursor:pointer">LOG IN WITH SPOTIFY</button>
<script>
const CLIENT="4a7c3b622127442984f1ec1a87d22b78";
const REDIRECT="https://frenchiiifries.github.io/Trollify/callback.html";
const SCOPES="user-read-playback-state user-modify-playback-state user-read-currently-playing playlist-read-private user-library-read";
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
document.getElementById("go").onclick=async()=>{
  const v=b64(crypto.getRandomValues(new Uint8Array(48)));
  const c=b64(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v)));
  localStorage.setItem("pkce_verifier",v);
  location="https://accounts.spotify.com/authorize?"+new URLSearchParams({client_id:CLIENT,response_type:"code",redirect_uri:REDIRECT,scope:SCOPES,code_challenge_method:"S256",code_challenge:c});
};
</script>
