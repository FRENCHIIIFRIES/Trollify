[package]
name = "trollify_player"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
librespot = { version = "0.8", default-features = false, features = ["native-tls", "rodio-backend", "with-libmdns"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
futures-util = "0.3"
sha1 = "0.10"
hex = "0.4"
# librespot-core 0.8.0 breaks with newer vergen; pinned like upstream master does
vergen = "=9.0.6"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
